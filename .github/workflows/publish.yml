name: Publish extension

# Собирает пакет и index.json и кладёт их в ветку `dist`.
# Blender берёт обновления отсюда:
# https://raw.githubusercontent.com/basubZ/colleagtion-addon/dist/index.json

on:
  push:
    branches: [main]
    paths:
      - "colleagtion/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # официальный сборщик extensions из исходников Blender
      - name: Get blender_ext.py
        run: |
          curl -sSfL https://raw.githubusercontent.com/blender/blender/v5.1.0/scripts/addons_core/bl_pkg/cli/blender_ext.py -o blender_ext.py

      - name: Build package and index.json
        run: |
          mkdir -p _dist
          python blender_ext.py build --source-dir colleagtion --output-dir _dist
          python blender_ext.py server-generate --repo-dir _dist --html
          cat _dist/index.json

      - name: Push to dist branch
        run: |
          cd _dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dist
